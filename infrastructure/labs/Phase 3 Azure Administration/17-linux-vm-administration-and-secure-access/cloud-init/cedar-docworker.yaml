#cloud-config

package_update: true

packages:
  - curl
  - jq
  - dnsutils
  - python3

users:
  - default
  - name: docworker
    gecos: Cedar document worker service account
    system: true
    shell: /usr/sbin/nologin
    lock_passwd: true
    no_create_home: true

write_files:
  - path: /usr/local/bin/cedar-docworker
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec python3 -m http.server 8080 \
        --bind 127.0.0.1 \
        --directory /opt/cedar-docworker

  - path: /etc/systemd/system/cedar-docworker.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Cedar and Finch document worker health service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=docworker
      Group=docworker
      WorkingDirectory=/opt/cedar-docworker
      ExecStart=/usr/local/bin/cedar-docworker
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true

      [Install]
      WantedBy=multi-user.target

runcmd:
  - install -d -o docworker -g docworker -m 0750 /opt/cedar-docworker
  - echo "Cedar document worker healthy" > /opt/cedar-docworker/health.txt
  - chown docworker:docworker /opt/cedar-docworker/health.txt
  - chmod 0640 /opt/cedar-docworker/health.txt
  - systemctl daemon-reload
  - systemctl enable --now cedar-docworker.service
  - echo "Cedar cloud-init baseline completed" > /var/local/cedar-cloud-init-complete